# frankensearch-quill resolves from the owner's frankensearch fork
# https://github.com/vladmlch/frankensearch (branch cass-prefix-expansion,
# pushed 2026-11-11) by exact rev (owner decision, 2026-11-10;
# rev moved 2026-11-11 for the follow-up cost fix, then again the same day
# for the measured parity fix). The rev is upstream
# frankensearch-quill-v0.4.1 (735701af) plus the query-side
# prefix-expansion commits: 1c80882f (family-registry split so a git pin
# patches only this crate), 1dd678f9 (per-leaf glob expansion; the typed
# GlobExpansionLimitExceeded carries the pattern), ce5f1bd6 (the two-arm
# Exact/Prefix lowering, so bare terms find tokens past the 4 KiB
# content_prefix window with a typed over-broad-prefix refusal), ab64bddd
# (the bulk glob-arm doc-id merge: the arm's constant score is built from
# one ascending k-way merge over the same validated cursors instead of
# draining a per-term union — owner-archive profile put ~98% of the arm's
# walk in that drain chain) and bb7d899a (the parity fix the B2 follow-up
# measured in: the two-arm glob drops its own literal term — the exact
# Term arm already matches every document it names, so decoding it again
# was the single largest posting list of a common-term expansion — and
# the merge consumes its smallest head in place through `peek_mut`, whose
# sift-down early-exits while the same stream stays the minimum, where
# the pop-then-reinsert loop paid two full heap sifts per posting; the
# drop changes no matched document, it removes the arm's flat boost
# from documents whose only globset membership was the literal itself).
# The version stays 0.4.1 and the CASS schema hash stays v9-quill:
# query-side only, no index-format change, no reindex. Patching crates.io
# (rather than rewriting the [dependencies] entry) keeps one resolution
# per package; every other frankensearch family crate keeps its crates.io
# resolution. build.rs (validate_quill_source_pin) refuses a missing or
# redirected entry, a branch/tag/path pin, a duplicate or off-source
# lockfile resolution, and any other family crate resolving from the
# fork's git source. Rollback: delete the entry and re-run `cargo fetch`.
frankensearch-quill = { git = "https://github.com/vladmlch/frankensearch", rev = "bb7d899a176a2de3d6106449448d020fe3f1e6e5" }

# The dependency graph is pinned to the asupersync 0.5.x line (0.5.0). Keep
# the frankensqlite (owner-fork), frankensearch, and franken-agent-detection
# pins aligned so Cargo.lock does not reintroduce an older parallel runtime stack.
#
# If you need to build against a local checkout of asupersync (sibling
# at ../asupersync) during runtime-level hacking, add the following
# [patch.crates-io] block LOCALLY and DO NOT COMMIT IT — a committed
# [patch] block pointing at sibling paths breaks every fresh clone:
#
# Add these entries to the committed [patch.crates-io] table above:
# asupersync = { path = "../asupersync" }
# franken-decision = { path = "../asupersync/franken_decision" }
# franken-evidence = { path = "../asupersync/franken_evidence" }
# franken-kernel = { path = "../asupersync/franken_kernel" }
#
# build.rs validates the committed dependency source contracts and can validate
# sibling repos below when `strict-path-dep-validation` is enabled.
#
# LOCAL DEVELOPMENT: Uncomment the [patch] sections below to build against
# local sibling repo checkouts instead of committed registry/git pins. These
# are commented out by default so that a clean clone builds without requiring
# specific directory layout. See build.rs for validation details.
#
# Never commit any of these sibling-path [patch] blocks re-enabled: a fresh
# clone without the sibling checkouts would no longer build.
#
# The fsqlite family has NO sibling-path override anymore: it resolves from
# the owner's fork through the committed [patch.crates-io] table above, and
# build.rs rejects any family entry that is not that exact git URL+rev. To
# hack the engine, work in the fork clone (../frankensqlite) and move the
# table's rev to the fork commit; do not re-enable a path patch for it.
# [patch."https://github.com/Dicklesworthstone/franken_agent_detection"]
# franken-agent-detection = { path = "../franken_agent_detection" }
#
# Enable strict validation before uncommenting any additional sibling path overrides:
# cargo check --features strict-path-dep-validation
# LOCAL DEV ONLY (CASS->Quill flip). Must be re-commented before commit: a path
# patch on a shared branch breaks every other checkout.
# [patch."https://github.com/Dicklesworthstone/frankensearch"]
# frankensearch = { path = "../frankensearch/frankensearch" }
# frankensearch-core = { path = "../frankensearch/crates/frankensearch-core" }
# frankensearch-index = { path = "../frankensearch/crates/frankensearch-index" }
# frankensearch-embed = { path = "../frankensearch/crates/frankensearch-embed" }
# frankensearch-fusion = { path = "../frankensearch/crates/frankensearch-fusion" }
# frankensearch-lexical = { path = "../frankensearch/crates/frankensearch-lexical" }
# frankensearch-quill = { path = "../frankensearch/crates/frankensearch-quill" }
# frankensearch-rerank = { path = "../frankensearch/crates/frankensearch-rerank" }

