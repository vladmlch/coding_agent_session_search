[package]
name = "coding-agent-search"
version = "0.11.0"
edition = "2024"
authors = ["Jeffrey Emanuel"]
description = "Unified TUI search over local coding agent histories"
license-file = "LICENSE"
resolver = "2"
repository = "https://github.com/Dicklesworthstone/coding_agent_session_search"
default-run = "cass"
# Local-only tool: never published to crates.io (or any other registry).
# Install from a checkout with `cargo install --path . --locked --bin cass`.
publish = false

[dependencies]
# Resident-memory supervision reuses the sysinfo version already in Cargo.lock.
sysinfo = { version = "*", default-features = false, features = ["system"] }
anyhow = "1.0.102"
thiserror = "2.0.18"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt", "ansi", "json"] }
asupersync = { version = "=0.5.0", features = ["test-internals"] }
clap = { version = "4.6.1", features = ["derive", "cargo", "env", "unicode", "wrap_help"] }
clap_complete = "4.6.5"
clap_mangen = "0.3.0"
indicatif = "0.18.4"
console = "0.16.3"
colored = "3.1.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
# The external HTTP embedding provider (reqwest/rustls) was removed by the
# local-only conversion; cass makes no outbound network calls.
toon = { version = "=0.2.4", package = "tru" }
tempfile = "3.27.0"
wait-timeout = "0.2.1"
rmp-serde = "1.3.1"  # MessagePack for binary metadata serialization (Opt 3.1)
toml = "1.1.2"
directories = "6.0.0"
which = "8.0.2"
shell-words = "1.1.1"
dotenvy = "0.15.7"
notify = "8.2.0"
# The exact registry release below retains the fsqlite 0.3.13 and 0.3.0
# asupersync-0.4.3 runtime migration
# and bug-fix wave (GH#333 concurrent-open BusyRecovery retries, GH#334
# FileIdentity re-derivation after file replacement — the cass#393
# st_dev/namespace-sidecar repair d29339c — 8-writer rollback cascade,
# cross-connection visibility) plus the 0.3.1 correctness wave: allocator
# post-savepoint page-aliasing quarantine, committed-freelist resurrection
# refusal, shared concurrent-writer EOF high-water, sidecar-less read-only
# first-contact opens (GH#140), Darwin OFD locking; and the 0.3.9 Windows
# sidecar-less read-only close fix (GH#438), without which CASS cannot reopen
# its canonical archive during indexing on Windows. Revisions 22af0753 and
# 027f62f2 admit FTS5's semantically read-only `integrity-check` command through
# both the physically read-only pager and `PRAGMA query_only` guards while
# retaining `ReadOnly` for every mutating FTS maintenance command. That exact
# behavior is required by CASS's pre-mutation full-rebuild integrity gate on
# Windows. 0.3.13 adds the
# autoindex-vanish corruption-writer fixes (the cass#434 writer class).
# 0.3.16 (adopted 2026-09-04) adds the GH#382 appended-WAL-tail fix
# (8d012706a — the per-page WAL rescan that looped the owner-archive
# writable open, bead g3zyo), the GH#405 FTS5 savepoint undo log
# (savepoints no longer clone the whole table per statement), and the
# GH#406 content-backed INSERT persisted as an incremental segment append.
# 0.3.17 adds incremental WAL-tail folding, reserved lock-byte/freelist
# repair (GH#410), FTS metadata and foreign-write visibility fixes (GH#408),
# and prepared-read schema-retry transaction cleanup. 0.3.18 adds parameterized
# rowid IN-list seeks (GH#415/cass#382), mutation-free read-only WAL readers,
# reader-registration error propagation and I/O buffer lifetime fixes.
# 0.4.1 adds GH#462's reserved-page WAL freelist repair and consumes the
# Asupersync 0.5 runtime. The 0.4.2 candidate adds explicit derived WAL-index
# recovery for read-only opens (GH#477). The published 0.4.4 family adds
# durable pending-freelist repairs. 0.4.6 stops a live B-tree page from being
# freed and granted again across a WAL generation (bd-b5vmw: integrity_check's
# "page N is referenced multiple times") and fixes a lost-index-entry race
# (bd-11sz4). 0.4.7 keeps index entries whole in large multi-row INSERTs
# (register writes past 65,535 were dropped: bd-2eebi), fixes the serialized
# DDL index race (bd-4iaoi), lets the deferred-FTS5 repair open bind a missing
# shadow autoindex (GH#503), caps the shared page plane (5s1la) and stops a
# connection's first sqlite_master query from reading the whole file (k2k20).
# 0.4.7 also made strict read-only opens spend ~30 s on a stale WAL index, so
# CASS skipped it. 0.4.9 (replacing the withdrawn 0.4.8) refuses that stale
# index promptly again (48c6cf6b2) and lets the first write after stock
# SQLite's empty, unindexed WAL index establish the WAL generation instead of
# failing BusyRecovery on every later commit (GH#443 / cass#509, 4b48c95d8).
# 0.4.12 carries the 0.4.10 data-integrity advisory fix (an explicit
# transaction's inserts appended through a stale retained right-edge leaf and
# corrupted the table b-tree: bd-obwsy), ROLLBACK returning the AUTOINCREMENT
# rowids it reserved (bd-gwoit), reading a WAL a stock writer truncated to zero
# bytes as empty (bd-yxqs9, cass GH#519), and index seeks for IN lists and
# k = ? ORDER BY id (GH#497/#498).
# 0.4.13 (upstream tag e4137af3) adds the GH#507 duplicate-implicit-rowid
# fix (the silent-PK corruption class on CASS's parallel BEGIN CONCURRENT
# ingest path), the close/io-Cx, read-only-open (GH#515/#528) and
# savepoint/WAL fixes, and — through the owner fork — the strict read-only
# open mode (`SQLITE_OPEN_STRICT_READ_ONLY`): an open that never writes or
# creates any sidecar of the store it reads, refusing every WAL-index state
# that needs recovery with the typed BusyRecovery instead of rebuilding a
# never-initialized `-shm` in place. CASS's doctor verify probe and FAD's
# external-store readers depend on that never-write contract.
# All family packages use 0.4.13 and resolve from the owner's frankensqlite
# fork (github.com/vladmlch/frankensqlite) at the exact rev named in the
# committed [patch.crates-io] table below — owner decisions 2026-11-07
# (fork), 2026-11-08 (DML seeks), 2026-11-09 (0.4.13 + strict read-only),
# 2026-11-11 (merged main lineage).
# These registry-shaped `=0.4.13` requirements stay here so the
# [patch.crates-io] table redirects every consumer (including
# franken-agent-detection's `^0.4.1` ask) to one fork resolution per
# package. build.rs checks each resolved package exactly.
frankensqlite = { version = "=0.4.13", package = "fsqlite", features = ["fts5", "async-api"] }
# The production storage-integrity probe calls FrankenSQLite's public VFS API
# directly so it can inspect native writer locks without opening the pager.
fsqlite-types = { version = "=0.4.13", package = "fsqlite-types" }
rayon = "1.12.0"
crossbeam-channel = "0.5.15"
parking_lot = "0.12.5"
fs2 = "0.4.3"
libc = "*"
same-file = "1.0.6"
lru = "0.18"
rustc-hash = "2.1.2"  # Fast non-cryptographic hashing for cache keys (P1 Opt 1.3), replaces unmaintained fxhash
xxhash-rust = { version = "0.8.15", features = ["xxh3"] }  # Fast content hashing for search-hit dedup (bead sdoxg)
itoa = "1.0.18"  # Zero-allocation integer-to-string for hot paths (bead w32k6)
smallvec = "1.15.1"  # Stack-allocated small vectors for hot paths (Opt 4.4)
regex = "1.12.3"
portable-pty = "0.9.0"
# FrankenTUI migration foundation (bead 2noh9.2.1), exact-pinned to the
# crates.io 0.5.0 release for reproducible CI builds.
ftui = { version = "=0.5.0" }
ftui-runtime = { version = "=0.5.0", features = ["native-backend", "crossterm-compat"] }
ftui-tty = { version = "=0.5.0" }
ftui-extras = { version = "=0.5.0", default-features = false, features = ["markdown", "syntax", "charts", "canvas", "theme", "clipboard", "clipboard-fallback", "export", "visual-fx", "forms", "validation", "help"] }
dirs = "7.0.0"
# Canonical paths without Windows' verbatim `\\?\` prefix where the plain
# spelling names the same file (source identities, 9v9xi).
dunce = "1.0.5"
walkdir = "2.5.0"
glob = "0.3.3"
base64 = ">=0.21"
blake3 = "1.8.5"
mime_guess = "2.0.5"
pulldown-cmark = { version = "0.13.3", default-features = false, features = ["html"] }
chrono = { version = "0.4.44", features = ["serde"] }
tracing-appender = "0.2.5"
strsim = "0.11.1"
once_cell = "1.21.4"
itertools = "0.15.0"
crc32fast = "1.5.0"
unicode-normalization = "0.1.25"
urlencoding = "2.1.3"
half = { version = "2.7.1", features = ["bytemuck"] }
memmap2 = "0.9.10"
bytemuck = "1.25.0"
# Semantic embedding + reranking are PURE-RUST via frankensearch's `native`
# feature: the frankentorch all-MiniLM-L6-v2 baseline plus the explicit
# multilingual MiniLM-L12 sentence embedder (NativeEmbedder), and the ms-marco
# cross-encoder reranker (NativeReranker). The old
# `fastembed`/ONNX-Runtime stack was removed (cass #308): ort 2.0.0-rc.12 could
# not run the all-MiniLM LayerNorm export, and its prebuilt AVX/AVX2 vendor
# binaries crashed pre-AVX2 CPUs at static init (#256/#307). No ONNX means no
# AVX-static-init hazard and no separate `-baseline` artifact is needed.
# 0.7.1 (quill 0.4.0) keeps the CASS schema hash (v9-quill, no rebuild) and
# carries the standard CASS Boolean grammar, the union seek_danger fix and the
# GH #499 live-doc numeric scoring that the 0.3.4 hotfix published, plus
# concurrent segment verification on open (GH #501), snippets only for
# returned hits, and a read-only refresh that skips the reopen when nothing
# was published.
frankensearch = { version = "=0.7.1", default-features = false, features = ["hash", "cass-compat", "quill", "ann", "native"] }
# Native OpenClaw transcripts and legacy VS Code Copilot sessions require SQLite.
# Keep both readers unconditional, including --no-default-features builds.
# codex-zstd reads Codex rollouts compressed to .jsonl.zst (GH #513).
# pi-durable reads Pi durable-harness SQLite stores (FAD #28); pi-sqlite reads
# pi_agent_rust SQLite sessions.
# GH#520 needs remote-mirror source identity, added after crates.io 0.3.10.
# Pin the exact fix until it is included in a published registry release.
# 2b8ddec (local fork F7..F16) ticks scan progress inside Cursor's
# state.vscdb parse, so the stall watchdog sees it, seeks the cursorDiskKV key
# index instead of scanning the table per composer (a ~25 min scan now takes
# ~18 s), and reads an external SQLite store left with an unusable WAL-index
# (the app crashed) through a private snapshot copy, failing store-style scans
# on an unreadable store instead of hiding it as zero sessions — except a
# provably empty store (0-byte file with no -wal content, or a schema with no
# tables), which scans to Ok with no sessions — and keeps the antigravity
# truncated_fields, status, error and media source fields in message extras,
# emitting error-only ERROR_MESSAGE and text-bearing CONVERSATION_HISTORY
# records (F10), and merges a Cursor composer conversation with its same-id
# agent transcript into one conversation instead of two colliding fragments
# (F11), keeps full message extras at every session size (F12), and emits
# textless identity-bearing Codex tool outputs as linked messages (F13), and
# archives the raw source records/parts for Copilot, Antigravity and OpenCode
# (F14-F16).
# fd071f9 (cass-strict-ro, F17) opens every external store with the fork's
# strict read-only mode (SQLITE_OPEN_STRICT_READ_ONLY), so a crashed store's
# unusable WAL-index never gets an in-place `-shm` rebuild on 0.4.13 — the
# typed BusyRecovery refusal engages the F9 snapshot fallback instead and the
# originals stay byte- and mtime-identical — and repoints FAD's own
# [patch.crates-io] table at the fork rev 898c4361 (FAD-internal table;
# cass's own committed patch table governs cass's resolution).
# 0d972a9 (cass-snapshot-cap, F18) caps that snapshot fallback at 2 GiB of
# db + -wal and refuses a copy the temp dir has no room for, reporting a
# typed scan error instead (a crashed 27 GB Devin store is not copied).
# 0.3.11 (fork master 832a812, merged 2026-11-11) is the unified line:
# upstream's v0.3.11 release wave — public canonical_connector_slug with
# alias-aware agent rewrites, 34-connector token/model/invocation
# attribution, Continue IDE/CLI and Cline SDK sessions, Qwen subagents,
# Copilot/Amp/Crush usage, Vibe native turns, 15-provider remote-mirror
# discovery (GH#520), 18-provider CASS_EXCLUDE_PATHS + per-source boundary
# hooks, mirrored-store discovery with ambiguous-fallback refusal and
# qualified streaming roots, and a mid-read failure discarding the whole
# incomplete transcript instead of yielding a partial session — plus the
# fork's merged F7–F18 wave above, plus the hermetic scan flag:
# ScanContext.allow_local_default_stores is true in both constructors (the
# issue #174 local default-store behavior production relies on) with a
# without_local_default_stores() opt-out hermetic harnesses use so
# in-process tests can never read the developer's real agent stores; only
# the opencode connector consults it today. cass's production scan sites
# build contexts through the constructors (flag stays true) and its test
# fixtures opt out.
# Source: the owner's pushed FAD fork https://github.com/vladmlch/franken_agent_detection
# (branch master at 832a812; the 0d972a9 cass-snapshot-cap pin stays as rollback).
franken-agent-detection = { version = "=0.3.11", git = "https://github.com/vladmlch/franken_agent_detection", rev = "832a81222a706e7db92d1e65577abee2ff89de61", features = ["connectors", "cursor", "chatgpt", "opencode", "crush", "goose", "hermes", "devin", "shelley", "grok-bot", "openclaw-sqlite", "copilot-vscdb", "codebuff", "codex-zstd", "pi-durable", "pi-sqlite"] }
wide = "1.4.0"  # Portable SIMD for P0 Opt 2: SIMD dot product
arrayvec = "0.7.6"  # Stack-based arrays for P1 Opt 1.4: Edge N-gram optimization
bloomfilter = "3.0.1"  # Probabilistic membership testing for P2 Opt 3.3: Workspace Cache

# Crypto for ChatGPT encrypted conversations and HTML export encryption.
# The aes-gcm + digest + hkdf + sha2 family must stay on compatible majors.
# aes-gcm 0.11, sha2 0.11, and hkdf 0.13 share digest 0.11; mixing either side
# with the former digest 0.10 family breaks the encryption trait bounds.
aes-gcm = "0.11"
ring = "0.17.14"
pbkdf2 = "0.13.0"  # PBKDF2 key derivation for Web Crypto compatible HTML export encryption

# SHA256 hashing for model verification
sha2 = "0.11"
hex = "0.4.3"

# Interactive terminal prompts for setup wizard
dialoguer = "0.12.0"

argon2 = "0.5.3"
hkdf = "0.13"  # Must match sha2 0.11 / aes-gcm 0.11 (digest 0.11 family); see comment above.
zeroize = { version = "1.8.2", features = ["derive"] }
flate2 = "1.1.9"
rand = "0.10"

# QR code generation (optional, for recovery secret QR codes)
qrcode = { version = "0.14.1", optional = true }
image = { version = "0.25.10", optional = true, default-features = false, features = ["png"] }
unicode-width = "0.2.2"

# macOS keychain access (optional, for ChatGPT decryption)
[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3.7.0"
# SO_NOSIGPIPE on the clipboard socket pair: macOS has no MSG_NOSIGNAL, so a
# write after the clipboard tool exits would raise SIGPIPE. Already built (with
# "all") for asupersync, so this adds no crate.
socket2 = { version = "0.6.5", features = ["all"] }

# Restores the default SIGPIPE disposition at startup (#356): with Rust's
# ignore-SIGPIPE default plus the release profile's panic=abort, every stdout
# write to a closed pipe (`cass ... | head`) became a SIGABRT crash report.
[target.'cfg(unix)'.dependencies]
sigpipe = "0.1.3"

[features]
default = ["qr", "encryption"]
qr = ["dep:qrcode", "dep:image"]
encryption = []  # Enables HTML export encryption (deps already included for ChatGPT)
backtrace = []
# NOTE: the former `semantic` feature was retired (bead tg5o9). It had become
# vacuous after cass#308: the pure-Rust `frankensearch/native` backend
# (frankentorch tensors, runtime-dispatched SIMD) ships in the always-on
# frankensearch feature set above, so every binary carries semantic support on
# any CPU and there is no `-baseline` artifact or AVX2 static-init hazard
# (cass#256) anymore. `--no-default-features` builds still had the native
# stack compiled in while the stale `cfg(not(feature = "semantic"))` arm
# refused `--mode semantic` with an ONNX-era error — an internally
# contradictory binary. Semantic availability is now a runtime question
# (model installed or hash fallback), never a compile-time one.
# Opt-in: upgrade sibling repo rev/worktree drift from warning to hard error and
# validate the optional /data/projects path checkouts before enabling local overrides.
strict-path-dep-validation = []
# Internal, in-memory seam for feeding engine-ranked message identities through
# the production CASS SQLite message projector and result reducer. This does not
# enable artifact persistence or make a conformance/admission claim by itself.
cass-layer-b-conformance = []

[build-dependencies]
blake3 = "1.8.5"
vergen = { version = "10.0.0", default-features = false, features = ["build", "cargo"] }
toml = "1.1.2"

[dev-dependencies]
assert_cmd = "2.2.2"
predicates = "3.1.4"
insta = { version = "1.47.2", features = ["yaml", "json"] }
criterion = "0.8.2"
once_cell = "1.21.4"
serial_test = "4.0.1"
# Version-format assertions in spec_version_semver_format and
# spec_diag_version_coherence; production code never parses versions.
semver = "1.0.28"
proptest = "1.11.0"
arbitrary = { version = "1", features = ["derive"] }
serde_yaml = "0.9.34"
rand = "0.10"
rand_chacha = "0.10"
# GH513 writes rollouts the way Codex compresses them; production reads them
# through franken-agent-detection's codex-zstd feature.
zstd = { version = "0.13", default-features = false }
# GH470 measures native model input tokens without padding or silent truncation.
# Reuse the tokenizer and regex backend already resolved by native MiniLM.
tokenizers = { version = "*", default-features = false, features = ["fancy-regex"] }
# rusqlite is retained only for C-SQLite interop fixtures in tests; production
# storage and historical salvage paths use frankensqlite.
rusqlite = { version = "0.40.2", features = ["bundled", "modern_sqlite"] }
# The manifest-policy build gate requires this explicit dev entry for compat
# fixture assertions, even though production also uses the same pinned crate.
fsqlite-types = { version = "=0.4.13", package = "fsqlite-types" }

# The fsqlite family resolves from the owner's frankensqlite fork (see the
# committed [patch.crates-io] table below) for every direct and transitive
# consumer, at uniform reviewed 0.4.13 versions. build.rs rejects duplicates
# and mixed sources.

[[bin]]
name = "cass"
path = "src/main.rs"
test = false

[[bin]]
name = "cass-pages-perf-bundle"
path = "src/bin/cass-pages-perf-bundle.rs"
test = false

[[bin]]
name = "e2e-run-bundle"
path = "src/bin/e2e-run-bundle.rs"
test = false

# Dev and test builds keep line-table debug info so backtraces and coverage
# stay useful without paying for full variable debug info. Host-level
# CARGO_PROFILE_DEV_DEBUG / CARGO_PROFILE_TEST_DEBUG and user-level cargo
# config profiles still outrank these manifest values.
[profile.dev]
debug = "line-tables-only"

[profile.test]
debug = "line-tables-only"

# fsqlite 0.3.x's async engine builds enormous debug-mode futures; at
# opt-level 0 a single statement poll can overflow even a 16 MiB test-thread
# stack (analytics::query storage tests SIGABRT'd during the 0.3.1 gate).
# Upstream frankensqlite develops at `[profile.dev] opt-level = 1` and
# franken_agent_detection uses this exact dependencies-only form for the same
# reason. Applies to dependencies only, never this crate's own code/tests.
#
# The fsqlite 0.3.4 uptake pushed these futures past what opt-level 1 covers:
# `cli_read_db_tests::state_meta_json_reports_active_data_dir_lock_without_db_path_metadata`
# SIGABRT'd on a stack overflow. Verified as a size problem, not a logic
# regression — the same test passes unchanged under a larger thread stack — so
# the fix is `RUST_MIN_STACK` in `.cargo/config.toml` rather than opt-level 2
# here. opt-level 2 also works but forces a full rebuild of every dependency
# at roughly double the artifact size, which is not worth it for a test-thread
# stack bound.
[profile.dev.package."*"]
opt-level = 1

# Thin LTO over 16 codegen units (owner decision, 2026-11-08): fat LTO with a
# single codegen unit compiled the cass crate on one thread for 30-40+ min;
# thin LTO keeps cross-crate optimization and builds on every core.
[profile.release]
lto = "thin"
codegen-units = 16
strip = true
panic = "abort"
opt-level = 3

# Optimized build with symbols for profiling (perf/flamegraphs).
# Usage: RUSTFLAGS="-C force-frame-pointers=yes" cargo build --profile profiling
[profile.profiling]
inherits = "release"
debug = true
strip = false

# Dedicated profile for benchmark runs that need to land in .bench-history/
# pass-over-pass ratchets per the gauntlet keep-gate rules. Inherits release
# (opt-level=3, lto, panic=abort) and adds line-tables + frame pointers so
# samply/flamegraph attribution works without rebuilding.
# Usage: RUSTFLAGS="-C force-frame-pointers=yes" cargo bench --profile release-perf
[profile.release-perf]
inherits = "release"
debug = "line-tables-only"
strip = false

# ── fsqlite family: owner-fork resolution (2026-11-07 owner decision) ──────
# Every fsqlite family crate resolves from the owner's frankensqlite fork,
# github.com/vladmlch/frankensqlite (branch merge/cass-into-main since the
# 2026-11-11 rev move), at the exact rev below. The rev is upstream main at
# v0.4.13-22 (22 commits past the v0.4.13 tag e4137af3: WAL size limits
# honored under write pressure (bd-5lw60), cached SHM mappings revalidated
# after truncation (bd-7do1d), window rows numbered independently of
# aggregate frames, wrapped ORDER BY parameters kept from becoming
# ordinals, correlated RETURNING evaluated at the DML and FK boundary,
# malformed catalog columns and virtual-table triggers rejected, self-read
# cursor images kept coherent across writes and rollback, plus the #531
# grouped-aggregate/index-prefix perf series) plus the fork's perf/feature
# commits rebased onto that lineage, so every family crate publishes
# version 0.4.13 and satisfies the registry-shaped `=0.4.13` requirements:
#   - e4c17486 (rebase of 10eadc63) perf(vdbe): seek the index range when
#     the WHERE carries residual conjuncts — `WHERE <indexed col> <range>
#     AND <residual>` no longer falls back to a full table scan; the walk
#     re-applies the whole WHERE per row (row set byte-identical, ~208x on
#     the motivating UNIQUE-text-key shape).
#   - aed53a33 (rebase of d9414f97) perf(vdbe): rowid range seeks accept
#     numbered placeholder bounds — `WHERE id > ?1 AND ...` now uses the
#     rowid range seek instead of a full scan, proven bit-identical to
#     stock SQLite by the fork's differential e2e oracle (~160x on its
#     fixture).
#   - bd-j9gub (db5d846e+1fcc81e8 rebased onto the v0.4.13-22 base; the
#     2026-11-08 0.4.12 line carried f39c8eb0+e8901664): DML
#     equality-prefix index seeks — a DELETE or UPDATE whose equality
#     conjuncts pin a PREFIX of a composite index key (`DELETE FROM
#     viewer_search_regions WHERE conversation_id = ?1`) SEARCHes the
#     leading-column index instead of full-scanning, proven row-for-row
#     against stock SQLite by the fork's differential oracle over affected
#     rows, changes(), RETURNING, triggers and AUTOINCREMENT; removes
#     cass's O(N^2) per-conversation viewer DELETEs
#     (.scratch/glm/2026-11-08-fsq-dml-backport/report.md).
#   - 898c4361 SQLITE_OPEN_STRICT_READ_ONLY (compat open_strict_read_only,
#     core Connection::open_strict_read_only, async
#     open_strict_read_only_sync): an open that never writes or creates
#     any sidecar of the store it reads — no `-shm` rebuild, no `-wal`
#     touch, no checkpoint, no journal replay — and refuses every
#     WAL-index state needing recovery with the typed BusyRecovery. FAD's
#     external-store readers (F17) and cass's doctor verify probe open
#     strict-read-only so user files and recorded backup bundles stay
#     byte- and mtime-identical
#     (.scratch/glm/2026-11-09-fsq-strict-ro/report.md).
#   - 9ead2d35 merges the fork line into the upstream main lineage and
#     2d55ddbd is the tip; the 2026-11-09 branch
#     cass-local-fixes-0413-ro (rev 898c4361) stays as rollback.
# Patching crates.io (rather than rewriting the [dependencies] entries to
# git) keeps one resolution per package across every consumer: FAD's own
# `^0.4.1` requirement converges on the same fork source. build.rs
# (validate_fsqlite_source_pin) refuses any family redirect that misses this
# exact URL+rev, any duplicate resolution, any version drift off 0.4.13, and
# any lockfile entry that resolves from elsewhere.
