# cargo-nextest configuration for cass
# https://nexte.st/book/configuration.html

# No custom store directory - use workspace-relative paths

# =============================================================================
# Default Profile - Development
# =============================================================================
[profile.default]
# Fail fast during local development
fail-fast = true
# Shared local default: 2 test threads (NEXTEST_TEST_THREADS or
# --test-threads can still override)
test-threads = 2
# Output format for local development
status-level = "pass"
final-status-level = "fail"
# Retry configuration
retries = 0
# Slow test thresholds
slow-timeout = { period = "30s", terminate-after = 2 }

# =============================================================================
# Full Profile - Complete local validation runs
# =============================================================================
[profile.full]
# Don't fail fast - run all tests to get complete results
fail-fast = false
# Shared local default: 2 test threads
test-threads = 2
# Verbose output for gate logs
status-level = "all"
final-status-level = "all"
# Retry flaky tests once in a full gate run
retries = 1
# Longer timeout for a full run
slow-timeout = { period = "60s", terminate-after = 2 }

# JUnit XML output for local gate runs
[profile.full.junit]
# Output path for JUnit XML report (relative to store dir)
path = "junit.xml"
# Report name shown in results
report-name = "cass-test-results"
# Store output on failure for debugging
store-success-output = false
store-failure-output = true

# =============================================================================
# Coverage Profile - Local coverage runs
# =============================================================================
[profile.coverage]
# Same settings as full
fail-fast = false
test-threads = 2
status-level = "all"
final-status-level = "all"
retries = 0
slow-timeout = { period = "120s", terminate-after = 2 }

[profile.coverage.junit]
path = "junit.xml"
report-name = "cass-coverage-test-results"
store-success-output = false
store-failure-output = true

# =============================================================================
# E2E Profile - End-to-end tests (sequential)
# =============================================================================
[profile.e2e]
# Don't fail fast - run all E2E tests
fail-fast = false
# E2E tests often need sequential execution
test-threads = 1
status-level = "all"
final-status-level = "all"
retries = 1
# E2E tests may take longer
slow-timeout = { period = "120s", terminate-after = 2 }

[profile.e2e.junit]
path = "junit.xml"
report-name = "cass-e2e-test-results"
store-success-output = false
store-failure-output = true

# =============================================================================
# Test Filtering
# =============================================================================

# =============================================================================
# Override Settings for Specific Tests
# =============================================================================
# Tests that should run with limited parallelism (e.g., TUI tests)
# Using threads-required to serialize UI tests that need exclusive terminal access
[[profile.default.overrides]]
filter = "test(ui_)"
threads-required = "num-cpus"

[[profile.full.overrides]]
filter = "test(ui_)"
threads-required = "num-cpus"
