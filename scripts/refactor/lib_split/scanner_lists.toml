# Source-scanner parity lists for the lib.rs split (stage 0 fix round).
# Each [scanner.<name>] records the test file and the production sources
# it reads as text, plus `patterns` — literals whose occurrence COUNT
# across the union of `sources` must stay constant when items move.
# Stage moves extend `sources`; removing a path without an equivalent
# replacement, or a needle count changing without a declared retarget,
# is a parity violation (scan_parity.py diff / diff_counts).

[scanner.golden_error_envelope]
test = "tests/golden_error_envelope.rs"
sources = [
  "src/lib.rs",
  "src/indexer/stall_watchdog.rs",
  "src/cli/commands/search/agent_filter_tests.rs",
  "src/cli/commands/search/effective_db_path_source.rs",
  "src/cli/commands/search/execute_search_operation.rs",
  "src/cli/commands/search/fieldbudgets.rs",
  "src/cli/commands/search/resolve_search_defaults.rs",
  "src/cli/commands/search/run_cli_search.rs",
  "src/cli/commands/search/search_lexical_self_heal_tests.rs",
  "src/cli/commands/search/searchlexicalselfhealdiagnosis.rs",
  "src/cli/commands/search/toon_encode_options_from_env.rs",
  "src/cli/commands/pack/pack_budget_ms.rs",
  "src/cli/commands/forget/command.rs",
  "src/cli/commands/analytics/fresh_franken_count_retry.rs",
  "src/cli/commands/analytics/analytics_query_cli_error_tests.rs",
  "src/cli/commands/analytics/run_analytics.rs",
  "src/cli/commands/analytics/analyticsvalidationsummary.rs",
  "src/cli/commands/import_chatgpt_export.rs",
  "src/cli/commands/stats_diag_storage/run_stats.rs",
  "src/cli/commands/status_health/cli_read_db_tests_part_1.rs",
  "src/cli/commands/status_health/probe_daemon_runtime_for_diagnostics.rs",
  "src/cli/commands/status_health/run_health.rs",
  "src/cli/commands/run_onboarding_interactive_wizard.rs",
]
patterns = ["kind_str", "CliErrorKind::"]
note = "error-kind scan: CliErrorKind literals, kind_str mapping, golden envelope"

[scanner.spec_exit_codes_documented]
test = "tests/spec_exit_codes_documented.rs"
sources = [
  "src/lib.rs",
  "src/doctor.rs",
  "src/doctor_undo.rs",
  "src/doctor_runs.rs",
  "src/viewer_bridge/deadline.rs",
  "src/indexer/checkpoint_deadline.rs",
  "src/indexer/stall_watchdog.rs",
  "src/search_service.rs",
  "src/search_service/deadline.rs",
  "src/search_service/memory.rs",
  "src/search_service/once.rs",
  "src/cli/commands/analytics/analyticsvalidationsummary.rs",
  "src/cli/commands/analytics/fresh_franken_count_retry.rs",
  "src/cli/commands/analytics/run_analytics.rs",
  "src/cli/commands/forget/command.rs",
  "src/cli/commands/import_chatgpt_export.rs",
  "src/cli/commands/pack/pack_budget_ms.rs",
  "src/cli/commands/quarantine_mirror_import.rs",
  "src/cli/commands/run_mirror_prune.rs",
  "src/cli/commands/run_onboarding_interactive_wizard.rs",
  "src/cli/commands/search/effective_db_path_source.rs",
  "src/cli/commands/search/execute_search_operation.rs",
  "src/cli/commands/search/fieldbudgets.rs",
  "src/cli/commands/search/resolve_search_defaults.rs",
  "src/cli/commands/search/run_cli_search.rs",
  "src/cli/commands/search/searchlexicalselfhealdiagnosis.rs",
  "src/cli/commands/search/toon_encode_options_from_env.rs",
  "src/cli/commands/stats_diag_storage/run_stats.rs",
  "src/cli/commands/status_health/probe_daemon_runtime_for_diagnostics.rs",
  "src/cli/commands/status_health/run_health.rs",
  "README.md",
  "AGENTS.md",
]
patterns = ["ExitCode"]
note = "exit-code literals must be documented; reads sources + docs"

[scanner.spec_aliases_resolve]
test = "tests/spec_aliases_resolve.rs"
sources = ["src/lib.rs"]
patterns = ["SUBCOMMAND_ALIASES"]
note = "SUBCOMMAND_ALIASES const inside normalize_args body"

[scanner.doctor_mutate_auditor]
test = "tests/doctor_mutate_auditor.rs"
sources = [
  "src/lib.rs",
  "src/doctor_chokepoint.rs",
  "src/doctor_runs.rs",
  "src/doctor_undo.rs",
  "src/doctor_robot_docs.rs",
]
patterns = [
  "run_doctor_explain",
  "run_doctor_emit_capabilities",
  "run_doctor_watch",
  "doctor-capabilities",
]
note = "doctor pass markers (pass-2/3 dispatch, pass-6 watch, pass-8 explain/capabilities); reads lib.rs plus the doctor_* companion sources by name"

[scanner.local_only_audit]
test = "tests/local_only_audit.rs"
sources = ["src/lib.rs", "tests/cli_dispatch_coverage.rs", "src/cli/commands/stats_diag_storage/run_stats.rs"]
dirs = ["src"]
patterns = ["REMOVED_COMMANDS", "REMOVED_FLAGS", "was removed"]
note = "REMOVED_COMMANDS/REMOVED_FLAGS tables + removed-command diagnostic; recursive .rs scan of src/** plus cli_dispatch_coverage pending flag"

[scanner.doctor_chokepoint]
test = "src/doctor_chokepoint.rs"
sources = ["src/lib.rs"]
patterns = ["DoctorFsMutationKind"]
note = "in-source chokepoint audit reads lib.rs (doctor_mutate_auditor companion)"

[scanner.doctor_insource]
test = "src/doctor.rs"
sources = ["src/lib.rs", "src/doctor.rs"]
patterns = [
  "pub(crate) fn run_doctor_impl(",
  "doctor::DoctorCommandRequest::from_cli_flags",
]
note = "legacy_cli_dispatch test in src/doctor.rs reads lib.rs + doctor.rs markers"

[scanner.agent_detection_completeness]
test = "tests/agent_detection_completeness.rs"
sources = ["src/lib.rs", "src/cli/commands/stats_diag_storage/run_diag.rs", "src/cli/commands/status_health/diagnostics.rs"]
patterns = ["diagnostics_connector_paths", "detect_installed_agents"]
note = "read_to_string(root.join(src/lib.rs)) — join()-form consumer"

[scanner.source_file_size_budget]
test = "tests/source_file_size_budget.rs"
sources = ["src/lib.rs"]
patterns = []
note = "line-count budget check — measures lib.rs, no literal needles (count-unsupported)"

[scanner.storage_sqlite_unsafe_absence]
test = "src/storage/sqlite.rs"
sources = ["src/lib.rs", "src/storage/sqlite.rs"]
absence = true
patterns = ["unsafe impl Send for", "unsafe impl Sync for", "SendFrankenConnection"]
note = "storage_source_forbids_manual_raw_connection_auto_trait_overrides: include_str!s sqlite.rs + ../lib.rs; ABSENCE scan — every pattern count must stay 0"

# Fixture WRITERS are not consumers (verified: they fs::write temp
# src/lib.rs fixtures, never read production source):
#   src/bin/e2e-run-bundle.rs, src/proof_artifact.rs, src/indexer/mod.rs

# Not scanners: tests/cli_dispatch_coverage.rs mentions src/lib.rs only
# in a doc comment; tests/viewer_bridge_extensions.rs uses "src/lib.rs"
# only inside JSON fixture payloads — both excluded.
