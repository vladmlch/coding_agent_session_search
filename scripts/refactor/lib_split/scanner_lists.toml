  "src/cli/commands/analytics/run_analytics.rs",
  "src/cli/commands/forget/command.rs",
  "src/cli/commands/import_chatgpt_export.rs",
  "src/cli/commands/pack/pack_budget_ms.rs",
  "src/cli/commands/quarantine_mirror_import.rs",
  "src/cli/commands/run_mirror_prune.rs",
  "src/cli/commands/run_onboarding_interactive_wizard.rs",
  "src/cli/commands/search/effective_db_path_source.rs",
  "src/cli/commands/search/execute_search_operation.rs",
  "src/cli/commands/search/fieldbudgets.rs",
  "src/cli/commands/search/resolve_search_defaults.rs",
  "src/cli/commands/search/run_cli_search.rs",
  "src/cli/commands/search/searchlexicalselfhealdiagnosis.rs",
  "src/cli/commands/search/toon_encode_options_from_env.rs",
  "src/cli/commands/stats_diag_storage/run_stats.rs",
  "src/cli/commands/status_health/probe_daemon_runtime_for_diagnostics.rs",
  "src/cli/commands/status_health/run_health.rs",
  "src/cli/commands/sessions_context.rs",
  "src/cli/commands/view/role_to_export_string.rs",
  "src/cli/commands/capabilities_introspect/capabilitiesresponse.rs",
  "src/cli/commands/index/run_lexical_reconcile_cli.rs",
  "src/cli/paths/session_paths.rs",
  "src/cli/commands/resume.rs",
  "src/cli/commands/export/indexed_export_cli_error.rs",
  "src/cli/commands/export_html.rs",
  "src/cli/commands/expand.rs",
  "src/cli/commands/timeline.rs",
  "src/cli/commands/sources/run_sources_command.rs",
  "src/cli/commands/models/run_models_command.rs",
  "src/cli/commands/models/run_models_remove.rs",
  "src/cli/commands/mappings.rs",
  "src/cli/commands/daemon.rs",
  "src/cli/commands/schedule.rs",
  "src/cli/commands/subcommand_robot_output_tests.rs",
  "src/doctor/policy.rs",
  "src/doctor/doctor_asset_taxonomy_tests_part_1.rs",
  "src/doctor/doctor_asset_taxonomy_tests_part_2.rs",
  "README.md",
  "AGENTS.md",
    "src/doctor/baseline.rs",
    "src/doctor/run_doctor_ls.rs",
    "src/doctor/backup_restore.rs",
    "src/doctor/sources.rs",
    "src/doctor/archive/doctor_archive_coverage_snapshot.rs",
    "src/doctor/baseline/document.rs",
    "src/doctor/support_bundle/capture.rs",
    "src/doctor/raw_mirror/query_doctor_raw_mirror_backfill_candidates.rs",
    "src/doctor/run.rs",
    "src/doctor/probes/integrity.rs",
    "src/cli/args_sub.rs",
    "src/cli/output/extract_search_terms.rs",
    "src/cli/argv/normalize.rs",
    "src/cli/dispatch.rs",
    "src/cli/entry.rs",
    "src/cli/error.rs",
    "src/cli/state/probe_state_db_strict_worker.rs",
  ]
patterns = [
  "ExitCode",
  # Emission-site predicates mirroring the test's three extractors
  # (spec_exit_codes_documented.rs): a `code: N` line whose next
  # non-blank line starts `kind:`, literal `process::exit(N)`, literal
  # `terminate(N)`. Regex patterns count per file, `.rs` sources only.
  { name = "cli_error_code_kind", regex = '^[ \t]*code: [0-9]+[^\n]*\n([ \t]*\n)*[ \t]*kind:', suffix = ".rs" },
  { name = "process_exit_int", regex = 'process::exit\([0-9]+\)', suffix = ".rs" },
  { name = "terminate_int", regex = 'terminate\([0-9]+\)', suffix = ".rs" },
]
note = "exit-code literals must be documented; reads sources + docs"

