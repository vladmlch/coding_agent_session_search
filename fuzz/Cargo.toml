[package]
name = "cass-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

# This crate is not part of the main workspace
[workspace]

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
arbitrary = { version = "1", features = ["derive"] }
base64 = "0.22"
serde_json = "1"
tempfile = "3"

[dependencies.coding-agent-search]
path = ".."

# This crate is its own workspace, so the root manifest's [patch.crates-io]
# table does not apply here: without this copy the fuzz build resolves the
# crates.io frankensearch-quill instead of the owner's fork. Keep it identical
# to the root table; tests/frankensqlite_compat_gates.rs
# (fuzz_workspace_patch_table_matches_root) fails by name when the two drift.
[patch.crates-io]
frankensearch-quill = { git = "https://github.com/vladmlch/frankensearch", rev = "f75d1d551c5fe73d0d4870a26b723faf6921de33" }

# Fuzz targets - each gets its own binary
# Encryption fuzz targets removed: pages::encrypt pruned in Phase-0 (87c8e8135).

[[bin]]
name = "fuzz_query_parser"
path = "fuzz_targets/fuzz_query_parser.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_connectors"
path = "fuzz_targets/fuzz_connectors.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_cli_argv"
path = "fuzz_targets/fuzz_cli_argv.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_html_export_renderer"
path = "fuzz_targets/fuzz_html_export_renderer.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_redact_secrets"
path = "fuzz_targets/fuzz_redact_secrets.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_time_parser"
path = "fuzz_targets/fuzz_time_parser.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_query_transpiler"
path = "fuzz_targets/fuzz_query_transpiler.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_robot_envelope_roundtrip"
path = "fuzz_targets/fuzz_robot_envelope_roundtrip.rs"
test = false
doc = false
bench = false
