[package]
name = "cass-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

# This crate is not part of the main workspace
[workspace]

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
arbitrary = { version = "1", features = ["derive"] }
base64 = "0.22"
serde_json = "1"
tempfile = "3"

[dependencies.coding-agent-search]
path = ".."

# This crate is its own workspace, so the root manifest's [patch.crates-io]
# table does not apply here: without this copy the fuzz build resolves the
# crates.io fsqlite family and FAD's fork-only API (SQLITE_OPEN_STRICT_READ_ONLY)
# fails to compile. Keep it identical to the root table;
# tests/frankensqlite_compat_gates.rs (fuzz_workspace_patch_table_matches_root)
# fails by name when the two drift.
[patch.crates-io]
fsqlite = { git = "https://github.com/vladmlch/frankensqlite", rev = "2d55ddbd6f630f4036f53629c9c0f080dc5a1f00" }
fsqlite-ast = { git = "https://github.com/vladmlch/frankensqlite", rev = "2d55ddbd6f630f4036f53629c9c0f080dc5a1f00" }
fsqlite-btree = { git = "https://github.com/vladmlch/frankensqlite", rev = "2d55ddbd6f630f4036f53629c9c0f080dc5a1f00" }
fsqlite-core = { git = "https://github.com/vladmlch/frankensqlite", rev = "2d55ddbd6f630f4036f53629c9c0f080dc5a1f00" }
fsqlite-error = { git = "https://github.com/vladmlch/frankensqlite", rev = "2d55ddbd6f630f4036f53629c9c0f080dc5a1f00" }
fsqlite-ext-fts5 = { git = "https://github.com/vladmlch/frankensqlite", rev = "2d55ddbd6f630f4036f53629c9c0f080dc5a1f00" }
fsqlite-ext-icu = { git = "https://github.com/vladmlch/frankensqlite", rev = "2d55ddbd6f630f4036f53629c9c0f080dc5a1f00" }
