# Cargo configuration for cass
# https://doc.rust-lang.org/cargo/reference/config.html

[build]
rustflags = ["-Z", "threads=4"]
# NOTE: do NOT set `jobs` here. A repo .cargo/config.toml outranks
# ~/.cargo/config.toml, so pinning it overrides whatever the host decided.
# This file previously carried `jobs = -1` ("all cores minus one"); on a
# 128-thread machine that is 127 parallel rustc, each forking a ~1GB
# rust-lld — enough to exhaust RAM and swap. Parallelism is a property of
# the MACHINE, not the project: scripts/lib/run_cargo.sh resolves it per
# the shared defaults (env, then user config, then the project default of
# 2), and the host can still set CARGO_BUILD_JOBS (which outranks every
# config file) or its own ~/.cargo/config.toml.

[env]
# fsqlite 0.3.x builds very large debug-mode futures; a single statement poll
# can overflow the default 2 MiB test-thread stack even with dependencies at
# opt-level 1 (see the [profile.dev.package."*"] note in Cargo.toml). 128 MiB
# is a reservation, not a commitment — Linux commits pages lazily — and it
# applies only to processes cargo launches from this repo, so the shipped
# binary is unaffected.
RUST_MIN_STACK = "134217728"

# Coverage exclusion patterns for cargo-llvm-cov
# These paths are excluded from coverage reports
CARGO_LLVM_COV_EXCLUDE = "tests/*,**/test*.rs,benches/*"

[target.x86_64-unknown-linux-gnu]
# Linux x86_64: use LLD for faster linking when the toolchain provides it
rustflags = ["-Z", "threads=4", "-C", "link-arg=-fuse-ld=lld"]

# Note: Linux ARM64 (aarch64-unknown-linux-gnu) uses the default linker;
# LLD is not guaranteed to be installed there

# macOS targets use the default ld64 linker from Xcode
# LLD is not available by default on macOS and causes build failures
# [target.aarch64-apple-darwin] - uses default linker
# [target.x86_64-apple-darwin] - uses default linker

# Alias for coverage command
[alias]
cov = "llvm-cov --workspace --ignore-filename-regex tests/ --ignore-filename-regex benches/"
cov-html = "llvm-cov --workspace --ignore-filename-regex tests/ --ignore-filename-regex benches/ --html --open"
cov-json = "llvm-cov --workspace --ignore-filename-regex tests/ --ignore-filename-regex benches/ --json"
